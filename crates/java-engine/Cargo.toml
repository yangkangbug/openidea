[package]
name = "java-engine"
description = "Standalone Rust Java engine: lexer, parser, brace-block reparse, class-file signatures, and name binding. No JVM."
version = "0.1.37"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
authors = ["OpenIDEA contributors"]
readme = "README.md"
publish = false

[dependencies]
# Class-file reader. 0BSD. Direct dependencies: bitflags (MIT OR Apache-2.0),
# cesu8 (MIT OR Apache-2.0). No JVM. See NOTICE.
cafebabe = "0.9.0"
